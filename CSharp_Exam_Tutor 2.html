const lessons={
loop:{title:"Loop — Iteration Statements",sub:"Conditional iteration • Definite iteration • Traversing a collection",mins:"35–45 นาที",sections:[
["แนวคิดและการเลือกใช้",`Loop คือโครงสร้างทำซ้ำ (Iteration Statements) แบ่งตามเอกสารเป็น Conditional iteration ได้แก่ while และ do...while, Definite iteration ได้แก่ for และการ Traversing items in a collection ด้วย foreach\n\nPretest loop ตรวจ condition ก่อนทำงาน: while และ for หากเงื่อนไขเป็น false ตั้งแต่แรกจะไม่ทำงานเลย ส่วน Posttest loop ทำงานก่อนตรวจ: do...while จึงทำอย่างน้อยหนึ่งรอบ`],
["Components of Loop",`ทุก loop ควรตรวจ 3 องค์ประกอบ: (1) Initialization step = START จุดเริ่มต้น (2) Condition = STOP เงื่อนไขตัดสินใจว่าจะทำต่อหรือหยุด (3) Counter step = STEP การเพิ่ม/ลดค่าควบคุมรอบ\n\nขาด START, STOP หรือ STEP หรือเรียงลำดับไม่สัมพันธ์กัน อาจเกิด Infinite Loop ได้`],
["Syntax สำคัญ",`while (condition) { statements; }\n\nfor (initialization; condition; update) { statements; }\n\ndo { statements; update; } while (condition);\n\nforeach (DataType item in collectionOrArray) { statements; }`],
["break, continue และ Nested Loop",`break ออกจาก loop ทั้งหมดทันที ส่วน continue ข้าม statements ที่เหลือของรอบปัจจุบัน แล้วไปเริ่มรอบถัดไป\n\nNested Loop ทำงานจาก loop ด้านในออกด้านนอก จำนวนรอบรวมของ nested loop แบบขนาดคงที่ = จำนวนรอบ outer × จำนวนรอบ inner`],
["อ่านโค้ดและข้อควรระวัง",`for (int i = 1; i <= 3; i++) จะทำเมื่อ i เป็น 1, 2, 3 รวม 3 รอบ จากนั้น i เป็น 4 แล้วหยุด\n\nระวัง <= กับ <, ลืม i++, วาง semicolon หลัง while/for โดยไม่ตั้งใจ และสับสน break กับ continue`]
],code:`using System;
class Program
{
    static void Main()
    {
        for (int i = 1; i <= 5; i++)
        {
            if (i == 3) continue;
            Console.Write(i + " ");
        }
        Console.WriteLine();
        int n = 1;
        do
        {
            Console.Write(n + " ");
            n++;
        } while (n <= 2);
    }
}`,output:"1 2 4 5 \n1 2",explain:"for เริ่ม i=1 ถึง 5 แต่ continue เมื่อ i=3 ทำให้ข้าม Console.Write เฉพาะรอบนั้น ส่วน do...while พิมพ์ n ก่อนเพิ่มค่าและตรวจเงื่อนไข จึงได้ 1 และ 2",tips:["for เหมาะกับจำนวนรอบที่รู้แน่นอน","while = เช็กก่อน / do...while = ทำก่อนเช็ก","break = ออก / continue = ข้ามรอบนี้","foreach อ่านสมาชิกจาก index 0 ถึง Length - 1 และตามเอกสารไม่ใช้เปลี่ยน contents ของ array/collection โดยตรง"],errors:["ลืม update ทำให้ Infinite Loop","ใช้ i <= array.Length ทำให้ Index เกินขอบเขต","คิดว่า do...while อาจทำ 0 รอบ","คิดว่า continue หยุด loop ทั้งหมด"]},
method:{title:"Method — แยกงานเป็นส่วนและนำกลับมาใช้",sub:"Modifier • Return type • Method name • Parameter(s) • Method body",mins:"55–70 นาที",sections:[
["แนวคิดและประโยชน์",`Method คือกลุ่ม statements ที่ทำงานเพื่อวัตถุประสงค์เฉพาะ ชื่อ Method ควรเป็น Verb และนิยมขึ้นต้นด้วยตัวพิมพ์ใหญ่ เช่น CalculateTotal()\n\nข้อดีตามเอกสาร: แยกโปรแกรมเป็นส่วนเล็กลง (smaller parts), อ่านและเข้าใจง่ายขึ้น และสนับสนุน code reuse\n\nข้อสำคัญ: ประกาศ user-defined methods ภายนอก Main() ภายใน class เดียวกัน (ตามรูปแบบตัวอย่างในเอกสาร)`],
["Basic Components of Method",`รูปแบบทั่วไป:\nModifier return_type method_name(parameters)\n{\n    method body\n}\n\n1) Modifier เช่น public, private  2) Return type เช่น int, float หรือ void (ไม่คืนค่า)  3) Method name ชื่อการกระทำ  4) Parameter(s) ตัวแปรรับค่าที่ส่งเข้ามา  5) Method body โค้ดที่ทำงาน`],
["Parameter vs Argument และการเรียกใช้",`Parameter คือชื่อตัวแปรในวงเล็บตอนประกาศ Method เช่น int a, int b ส่วน Argument คือค่าจริงที่ส่งตอนเรียก เช่น Add(3, 4)\n\nจำนวน ลำดับ และชนิดของ Argument ต้องสอดคล้องกับ Parameter ที่ Method กำหนด\n\nstatic method เรียกจาก Main ซึ่งเป็น static ได้โดยตรงเมื่อ Method นั้นเป็น static เช่น public static int Add(...)`],
["Method 4 ประเภท",`จำแนกตาม Parameter และ Return data ได้ 4 แบบ:\n\nA. No parameter + No return: void ShowMenu()\nB. No parameter + Return data: int GetNumber()\nC. Parameter(s) + No return: void SayHi(string name)\nD. Parameter(s) + Return data: int Sum(int a, int b)\n\nBuilt-in / Standard / Predefined method เช่น Console.WriteLine() ต่างจาก User-defined method ที่ผู้เขียนสร้างเอง`],
["Return และการส่งค่ากลับ",`Return type ที่ไม่ใช่ void ต้องคืนค่าด้วย return ที่ชนิดเข้ากัน เช่น int ต้อง return int และทุกเส้นทางการทำงานต้องคืนค่า\n\nreturn ส่งค่ากลับไปยังจุดเรียกและจบการทำงานของ Method ทันที ส่วน void ไม่ต้องคืนข้อมูล (เขียน return; เพื่อออกก่อนกำหนดได้)\n\nผลลัพธ์ที่ return ไม่ได้แสดงหน้าจอเอง ต้องนำไปใช้ เช่น Console.WriteLine(Add(2,3));`],
["ตัวอย่างประยุกต์และ Debug",`แยกการคำนวณออกจากการแสดงผล: Method คำนวณรับ input ผ่าน Parameter และคืนผลผ่าน Return ทำให้เรียกซ้ำกับข้อมูลหลายชุดได้\n\nข้อผิดพลาดยอดฮิต: ลืม return, return ผิดชนิด, เรียกโดยไม่ส่ง argument, สลับลำดับ argument, ประกาศ Method ซ้อนใน Main และเข้าใจว่า Console.WriteLine คือ return`]
],code:`using System;
class Program
{
    static void Main()
    {
        SayHi("Mina");
        int total = Sum(9, 4);
        Console.WriteLine("Sum = " + total);
        Console.WriteLine("Major = " + GetNumMajor());
    }

    public static void SayHi(string name)
    {
        Console.WriteLine("Hello " + name);
    }

    public static int Sum(int num1, int num2)
    {
        return num1 + num2;
    }

    public static int GetNumMajor()
    {
        int numMajor = 5;
        return numMajor;
    }
}`,output:"Hello Mina\nSum = 13\nMajor = 5",explain:"SayHi รับ Parameter ชนิด string แต่ return type เป็น void จึงแสดงผลอย่างเดียว; Sum รับ int สองค่าและคืนผลรวมเป็น int; GetNumMajor ไม่มี Parameter แต่คืน int กลับมา",tips:["void = ไม่คืนข้อมูล; int/string/float = ต้อง return ค่าชนิดนั้น","Parameter อยู่ตอนประกาศ / Argument อยู่ตอนเรียก","return จบ Method ทันที","จำ 4 ช่อง: ไม่มี/มี Parameter × ไม่มี/มี Return"],errors:["ลืม return ใน Method ที่ไม่ใช่ void","ใช้ Console.WriteLine แทน return","สลับ Parameter กับ Argument","จำนวนหรือชนิด Argument ไม่ตรงกับ Parameter","ประกาศ Method ไว้ภายใน Main()"]},
array:{title:"Array — เก็บข้อมูลชนิดเดียวกันหลายค่า",sub:"Declaration • Creation • Initialization • Array as Parameter • Multidimensional",mins:"55–70 นาที",sections:[
["แนวคิดและ Index",`Array คือ collection ของ values ที่มี data type เดียวกัน แต่ละตัวเรียกว่า element และเข้าถึงด้วย index ซึ่งเริ่มจาก 0\n\nถ้ามีสมาชิก n ตัว index ที่ถูกต้องคือ 0 ถึง n-1 ดังนั้นตำแหน่งสุดท้ายคือ Length - 1 ไม่ใช่ Length\n\nArray มีขนาดคงที่หลังสร้างแล้ว; ใช้ Length อ่านจำนวนสมาชิก`],
["Declaration, Creation, Initialization",`Declaration: DataType[] variableName; เช่น int[] nums;\nCreation: variableName = new DataType[size]; เช่น nums = new int[5];\nรวมกัน: string[] students = new string[3];\nInitialization: int[] num = new int[3] {1,2,3}; หรือ int[] num = {1,2,3};\n\nค่าเริ่มต้นของ int array ที่ยังไม่กำหนดคือ 0, bool คือ false และ reference type เช่น string คือ null`],
["เข้าถึงและวนซ้ำ",`อ่าน/เขียนสมาชิกด้วย array[index] เช่น scores[0] = 80; และ Console.WriteLine(scores[1]);\n\nfor เหมาะเมื่อจำเป็นต้องใช้ index หรือแก้ไขสมาชิก: for (int i=0; i<nums.Length; i++) nums[i] += 1;\n\nforeach (int value in nums) อ่านค่าแต่ละ element ได้สะดวก ไม่ต้องจัดการ index; ตามเอกสาร foreach ใช้ traversing collection/array และไม่ใช้เปลี่ยน contents โดยตรง`],
["Array เป็น Parameter และ Return Array",`ส่งทั้ง array เข้า Method ได้ เช่น static int Sum(int[] values) แล้วเรียก Sum(nums) โดย Parameter รับ array ทั้งชุด\n\nMethod สามารถคืนค่าเป็น array ได้ เช่น static int[] CreateNumbers() { return new int[] {2,4,6}; }\n\nหมายเหตุ: เอกสารระบุว่า Method คืนได้เพียงหนึ่งค่า แต่ C# สามารถส่งหลายข้อมูลกลับเป็น array หนึ่งชุดได้`],
["Multidimensional Arrays",`Array หลายมิติ เช่น int[,] matrix = new int[2,3]; มี 2 แถว 3 คอลัมน์ เข้าถึงด้วย matrix[row, column]\n\nกำหนดค่าแบบ initializer: int[,] matrix = { {1,2,3}, {4,5,6} };\n\nวนซ้ำด้วย nested for: for (int r=0; r<matrix.GetLength(0); r++) for (int c=0; c<matrix.GetLength(1); c++) ...\nGetLength(0) คือจำนวนแถว และ GetLength(1) คือจำนวนคอลัมน์`],
["Useful Properties / Methods และ Debug",`สิ่งที่ควรจำ: Length = จำนวนสมาชิกทั้งหมดใน array หนึ่งมิติ; Rank = จำนวนมิติ; GetLength(dimension) = ขนาดในมิติที่ระบุ; Array.Sort(array) เรียงข้อมูล; Array.Reverse(array) กลับลำดับ\n\nระวัง IndexOutOfRangeException, ใช้ <= แทน <, สับสน Length กับ index สุดท้าย และส่ง element เดียวแทนทั้ง array`]
],code:`using System;
class Program
{
    static void Main()
    {
        int[] scores = { 70, 85, 90 };
        Console.WriteLine("Count = " + scores.Length);
        for (int i = 0; i < scores.Length; i++)
            Console.WriteLine(i + ": " + scores[i]);
        Console.WriteLine("Sum = " + Sum(scores));
        foreach (int score in scores)
            Console.Write(score + " ");
    }

    static int Sum(int[] values)
    {
        int total = 0;
        for (int i = 0; i < values.Length; i++)
            total += values[i];

["OOP vs Procedural",`OOP ใช้ Class สร้างหลาย instances พร้อมกัน และมองสิ่งต่าง ๆ เป็น Object ได้ ส่วน Procedural Programming เป็นลำดับอย่างเป็นระบบของ statements, functions และ commands; เอกสารชี้ว่าไม่เหมาะกับระบบขนาดใหญ่เท่า OOP\n\nใช้ Class เมื่อข้อมูลและพฤติกรรมควรอยู่รวมกันเป็นหน่วยเดียว`],

function practicePage(){header("แบบฝึกหัดท้ายบท","เลือกบทและตอบคำถาม • เฉลยหลังตรวจคำตอบ");$("#content").innerHTML=`<div class="card"><label>เลือกบทเรียน</label><select class="field" id="practiceTopic"><option value="loop">Loop</option><option value="method">Method</option><option value="array">Array</option><option value="class">Class</option></select><div id="practiceQs"></div></div>`;$("#practiceTopic").onchange=draw;function draw(){let k=$("#practiceTopic").value;$("#practiceQs").innerHTML=practiceBank[k].map((q,i)=>`<div class="qrow"><b>${i+1}. ${q[0]}</b>${q.slice(1,5).map((v,j)=>`<label class="quiz-opt"><input type="radio" name="p${i}" value="${j}"> ${"ABCD"[j]}. ${esc(v)}</label>`).join("")}<div id="pr${i}" class="hidden"></div></div>`).join("")+`<button class="primary" id="gradePractice">ตรวจคำตอบ</button>`;$("#gradePractice").onclick=()=>{let score=0;practiceBank[k].forEach((q,i)=>{let a=document.querySelector(`input[name="p${i}"]:checked`);let ok=a&&+a.value===q[5];if(ok)score++;let el=$("#pr"+i);el.classList.remove("hidden");el.innerHTML=`<div class="${ok?"goodbox":"badbox"}">${ok?"ถูกต้อง":"คำตอบที่ถูก: "+ "ABCD"[q[5]]} — ${esc(q[6])}</div>`});state.scores[k]=score+"/"+practiceBank[k].length;save()}}draw()}
function cheat(){header("Cheat Sheet","สรุป Syntax ที่ควรจำก่อนเข้าห้องสอบ");$("#content").innerHTML=`<div class="card"><h2>Loop</h2><pre>while (condition) { statements; }\nfor (initialization; condition; update) { }\ndo { statements; } while (condition);\nforeach (type item in array) { }\nbreak;     // ออกจาก loop\ncontinue;  // ข้ามรอบปัจจุบัน</pre><p>Pretest: while / for • Posttest: do...while • Nested loop: ด้านในทำงานครบในแต่ละรอบของด้านนอก</p></div>
<div class="card"><h2>Method</h2><pre>Modifier return_type MethodName(parameters)\n{\n    // method body\n    return value; // เมื่อ return type ไม่ใช่ void\n}\npublic static void SayHi(string name) { }\npublic static int GetCount() { return 5; }\npublic static void Show(int age) { }\npublic static int Sum(int a,int b) { return a+b; }</pre><p>Parameter = ตัวแปรใน declaration • Argument = ค่าตอนเรียก • void = ไม่มี return • Method อยู่ภายนอก Main() ภายใน class</p></div>
<div class="card"><h2>Array</h2><pre>int[] nums;                         // declaration\nnums = new int[5];                  // creation\nint[] a = {1,2,3};                  // initialization\nint first = a[0];                  // access\nfor(int i=0; i<a.Length; i++) { }\nforeach(int x in a) { }\nstatic int Sum(int[] values) { ... }\nint[,] matrix = {{1,2},{3,4}};\nmatrix[0,1]; matrix.GetLength(0);</pre><p>Index เริ่ม 0 • สุดท้าย Length-1 • 2D array [row,column] • Array.Sort(a) / Array.Reverse(a)</p></div>
<div class="card"><h2>Class / Object</h2><pre>class Student {\n  private string name; // field\n  public string Name {\n    get { return name; }\n    set { name = value; }\n  }\n  public Student(string n) { name=n; } // constructor\n}\nStudent s = new Student(\"Mia\");</pre><p>Class = blueprint • Object = instance • new = สร้าง object • Field = class scope variable • Property = get/set • Constructor ชื่อเหมือน Class ไม่มี return type</p></div>
<div class="card"><h2>จุดที่มักออกสอบ / ระวัง</h2><ul><li>นับรอบ loop จากค่าเริ่มต้นและ condition จริงทีละรอบ</li><li>แยก break / continue และ pretest / posttest</li><li>Method: เช็ก return type, parameter, argument และ return ทุกเส้นทาง</li><li>Array: index 0-based, ใช้ i &lt; Length</li><li>Class: field vs property, get vs set, constructor vs method</li></ul></div>`}
function errorsPage(){header("Error Log","จดจุดที่พลาด พร้อมแก้ไขและลบได้ • เก็บใน LocalStorage");$("#content").innerHTML=`<div class="card"><h2>เพิ่มข้อผิดพลาด / สิ่งที่ยังไม่เข้าใจ</h2><input id="errTitle" class="field" placeholder="หัวข้อ เช่น ลืม return"><textarea id="errDetail" class="field" style="margin-top:9px;min-height:80px" placeholder="เกิดจากอะไร? วิธีแก้ / ตัวอย่างที่ถูกต้อง"></textarea><div class="actions"><button class="primary" id="addError">บันทึกรายการ</button><button class="quiet" id="suggestErrors">เพิ่มตัวอย่างที่พบบ่อย</button></div></div><div id="errorList"></div>`;function draw(){let box=$("#errorList");box.innerHTML=state.errors.length?state.errors.map((e,i)=>`<div class="card"><div class="lesson-head"><b>${esc(e.title)}</b><button class="danger" data-del="${i}">ลบ</button></div><p style="white-space:pre-line">${esc(e.detail)}</p><button class="quiet" data-edit="${i}">แก้ไข</button></div>`).join(""):"<p class='muted'>ยังไม่มีรายการ ลองเพิ่มสิ่งที่พลาดจากแบบฝึกหัด</p>";$$("[data-del]").forEach(b=>b.onclick=()=>{state.errors.splice(+b.dataset.del,1);save();draw()});$$("[data-edit]").forEach(b=>b.onclick=()=>{let i=+b.dataset.edit,e=state.errors[i],t=prompt("แก้ไขหัวข้อ",e.title);if(t===null)return;let d=prompt("แก้ไขรายละเอียด",e.detail);if(d!==null){state.errors[i]={title:t,detail:d};save();draw()}})}$("#addError").onclick=()=>{let t=$("#errTitle").value.trim(),d=$("#errDetail").value.trim();if(!t)return alert("กรุณาใส่หัวข้อ");state.errors.unshift({title:t,detail:d});save();$("#errTitle").value=$("#errDetail").value="";draw()};$("#suggestErrors").onclick=()=>{["ลืมใส่ return","ใช้ Index ของ Array ผิด","เขียนเงื่อนไข Loop ผิด","สับสน Parameter และ Argument","ใช้ get และ set ไม่ถูกต้อง"].forEach(t=>state.errors.push({title:t,detail:"บันทึกตัวอย่างไว้เตือนตนเอง: ตรวจ Syntax และไล่ค่าตัวแปรทีละขั้น"}));save();draw()};draw()}
function norm(s){return String(s||"").toLowerCase().replace(/\s+/g,"").replace(/;+$/,"").replace(/[(){}]/g,"").replace(/int32/g,"int").trim()}
function shuffle(a){let b=a.slice();for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function startExam(){let one=mcq.map((q,i)=>{let order=shuffle([0,1,2,3]);return {id:i,topic:q[0],q:q[1],opts:order.map(x=>q[x+2]),answer:order.indexOf(q[6]),why:q[7]}});let two=missing.map((q,i)=>({id:i,topic:q[0],q:q[1],code:q[2],accepted:q[3],why:q[4]}));state.exam={started:Date.now(),submitted:false,one:shuffle(one),two:shuffle(two),answers:{},score:null};save();examPage()}
function examPage(){
 header("Mock Exam · 90 ข้อ","Part 1: 60 Multiple Choice • Part 2: 30 Missing Code • 90 นาที");
 if(!state.exam||!state.exam.one) {$("#content").innerHTML=`<div class="card hero"><h2>ข้อสอบจำลอง 90 คะแนน</h2><p>แนะนำเวลา 90 นาที • ข้อละ 1 คะแนน • สุ่มลำดับข้อและตัวเลือกเมื่อเริ่มสอบใหม่</p><ul><li>Part 1 มี 60 ข้อ เลือก A–D เพียงคำตอบเดียว</li><li>Part 2 มี 30 ข้อ พิมพ์ Code ที่หายไป</li><li>ระหว่างทำข้อสอบจะไม่แสดงเฉลย</li><li>กดส่งข้อสอบแล้วจึงเห็นคะแนน เฉลย และคำอธิบายทุกข้อ</li></ul><button class="primary" id="startExam">เริ่มสอบ 90 นาที</button></div>`;$("#startExam").onclick=startExam;return}
 let ex=state.exam;
 if(ex.submitted){renderExamResult();return}
 let answered=Object.keys(ex.answers).filter(k=>String(ex.answers[k]).trim()!=="").length;
 $("#content").innerHTML=`<div class="card hero"><div class="lesson-head"><div><h2>กำลังทำข้อสอบ</h2><p>ตอบแล้ว <b>${answered}/90</b> ข้อ</p></div><div class="timer" id="timer">90:00</div></div><div class="progress-wrap"><div class="progress" style="width:${answered/90*100}%"></div></div><p class="muted">ยังไม่แสดงเฉลยจนกว่าจะส่งข้อสอบ</p><button class="primary" id="submitExam">ส่งข้อสอบและตรวจคะแนน</button></div>
 <div class="card"><h2>Part 1 · Multiple Choice (60 คะแนน)</h2><p class="muted">เลือกคำตอบที่ถูกต้องที่สุด</p>${ex.one.map((q,i)=>`<div class="qrow"><b>${i+1}. [${q.topic}] ${esc(q.q)}</b>${q.opts.map((o,j)=>`<label class="quiz-opt ${ex.answers["m"+q.id]===String(j)?"chosen":""}"><input type="radio" name="m${q.id}" value="${j}" ${ex.answers["m"+q.id]===String(j)?"checked":""}> ${"ABCD"[j]}. ${esc(o)}</label>`).join("")}</div>`).join("")}</div>
 <div class="card"><h2>Part 2 · Missing Code (30 คะแนน)</h2><p class="muted">พิมพ์เฉพาะส่วนของโค้ดที่หายไป ไม่ต้องพิมพ์ทั้งโปรแกรม</p>${ex.two.map((q,i)=>`<div class="qrow"><b>${i+61}. [${q.topic}] ${esc(q.q)}</b><pre>${esc(q.code)}</pre><input class="field" data-miss="${q.id}" value="${esc(ex.answers["c"+q.id]||"")}" placeholder="พิมพ์โค้ดที่หายไป…"></div>`).join("")}</div>
 <div class="card"><b>ตอบแล้ว ${answered} / 90</b><div class="actions"><button class="primary" id="submitExam2">ส่งข้อสอบและตรวจคะแนน</button></div></div>`;
 $$('input[type="radio"]').forEach(el=>el.onchange=()=>{ex.answers["m"+el.name.slice(1)]=el.value;save();examPageScrollSafe()});
 $$("[data-miss]").forEach(el=>el.oninput=()=>{ex.answers["c"+el.dataset.miss]=el.value;save();updateAnsweredCount()});
 $("#submitExam").onclick=submitExam;$("#submitExam2").onclick=submitExam;
 startTimer();
}
function examPageScrollSafe(){let el=document.activeElement;/* avoid rerender while selecting */updateAnsweredCount()}
function updateAnsweredCount(){let ex=state.exam;if(!ex)return;let n=Object.keys(ex.answers).filter(k=>String(ex.answers[k]).trim()!=="").length;let b=$(".hero .lesson-head p");if(b)b.innerHTML=`ตอบแล้ว <b>${n}/90</b> ข้อ`;let bar=$(".hero .progress");if(bar)bar.style.width=n/90*100+"%"}
function startTimer(){if(examTimer)clearInterval(examTimer);let ex=state.exam;if(!ex||ex.submitted)return;function tick(){let remain=Math.max(0,90*60-Math.floor((Date.now()-ex.started)/1000));let el=$("#timer");if(el)el.textContent=String(Math.floor(remain/60)).padStart(2,"0")+":"+String(remain%60).padStart(2,"0");if(remain===0){clearInterval(examTimer);submitExam()}}tick();examTimer=setInterval(tick,1000)}
function submitExam(){if(!confirm("ยืนยันส่งข้อสอบ? หลังส่งจะไม่สามารถแก้คำตอบได้ และจะแสดงเฉลยทั้งหมด"))return;let ex=state.exam,mc=0,miss=0;ex.one.forEach(q=>{if(String(ex.answers["m"+q.id])===String(q.answer))mc++});ex.two.forEach(q=>{let a=norm(ex.answers["c"+q.id]);if(q.accepted.some(v=>norm(v)===a))miss++});ex.submitted=true;ex.score={mc,miss,total:mc+miss};state.scores.exam=ex.score;save();if(examTimer)clearInterval(examTimer);examPage()}
function renderExamResult(){let ex=state.exam,s=ex.score;let mwrong=ex.one.filter(q=>String(ex.answers["m"+q.id])!==String(q.answer));let cwrong=ex.two.filter(q=>!q.accepted.some(v=>norm(v)===norm(ex.answers["c"+q.id])));$("#content").innerHTML=`<div class="card hero"><span class="tag">ส่งข้อสอบแล้ว</span><h2>คะแนนรวม ${s.total} / 90</h2><div class="grid3"><div><div class="stat">${s.mc}/60</div><div>Part 1 · MCQ</div></div><div><div class="stat">${s.miss}/30</div><div>Part 2 · Missing Code</div></div><div><div class="stat">${Math.round(s.total/90*100)}%</div><div>คิดเป็นเปอร์เซ็นต์</div></div></div><div class="actions"><button class="primary" id="newExam">เริ่มสอบใหม่ (สุ่มข้อสอบ)</button><button class="quiet" onclick="go('errors')">บันทึกข้อผิดพลาด</button></div></div>
 <div class="card"><h2>สรุปข้อที่ต้องทบทวน</h2><p>ตอบผิดหรือไม่ตอบ ${mwrong.length+cwrong.length} ข้อ • ตอบถูก ${s.total} ข้อ</p><p>Part 1 ผิด/ไม่ตอบ ${mwrong.length} ข้อ · Part 2 ผิด/ไม่ตอบ ${cwrong.length} ข้อ</p></div>
 <div class="card"><h2>เฉลย Part 1 · Multiple Choice</h2>${ex.one.map((q,i)=>{let a=ex.answers["m"+q.id],ok=String(a)===String(q.answer);return `<div class="result"><b>${i+1}. ${esc(q.q)}</b><p class="${ok?"success":"badbox"}">${a===undefined?"ไม่ได้ตอบ":ok?"ตอบถูก":"ตอบผิด"} · คำตอบที่ถูก: ${"ABCD"[q.answer]}. ${esc(q.opts[q.answer])}</p><p class="muted">เหตุผล: ${esc(q.why)}</p></div>`}).join("")}</div>
 <div class="card"><h2>เฉลย Part 2 · Missing Code</h2>${ex.two.map((q,i)=>{let a=ex.answers["c"+q.id]||"",ok=q.accepted.some(v=>norm(v)===norm(a));return `<div class="result"><b>${i+61}. ${esc(q.q)}</b><pre>${esc(q.code)}</pre><p class="${ok?"success":"badbox"}">${!a?"ไม่ได้ตอบ":ok?"ตอบถูก":"ตอบผิด"} · คำตอบตัวอย่าง: <code>${esc(q.accepted[0])}</code></p><p class="muted">เหตุผล: ${esc(q.why)}</p></div>`}).join("")}</div>`;
 $("#newExam").onclick=()=>{if(confirm("เริ่มสอบใหม่และสุ่มข้อสอบใหม่? ผลสอบเดิมจะถูกแทนที่"))startExam()}
}
function searchPage(q){if(!q.trim())return;let hits=[];Object.entries(lessons).forEach(([k,l])=>l.sections.forEach(s=>{if((s[0]+" "+s[1]).toLowerCase().includes(q.toLowerCase()))hits.push({k,title:s[0],text:s[1]})}));mcq.forEach((x,i)=>{if(x.join(" ").toLowerCase().includes(q.toLowerCase()))hits.push({k:"exam",title:"Mock Exam question",text:x[1]})});header("ผลการค้นหา",`คำค้น: ${q} • ${hits.length} รายการ`);$("#content").innerHTML=hits.length?hits.slice(0,50).map(h=>`<div class="card"><span class="tag">${h.k.toUpperCase()}</span><h3>${esc(h.title)}</h3><p>${esc(h.text)}</p><button onclick="go('${h.k==="exam"?"exam":h.k}')">เปิดเนื้อหา</button></div>`).join(""):"<div class='card'>ไม่พบคำที่ค้นหา ลองใช้คำว่า return, index, constructor, break หรือ foreach</div>"}
function render(){switch(page){case"home":home();break;case"plan":planPage();break;case"loop":case"method":case"array":case"class":lessonPage(page);break;case"trace":tracePage();break;case"practice":practicePage();break;case"exam":examPage();break;case"cheat":cheat();break;case"errors":errorsPage();break;default:home()}}
$("#search").addEventListener("keydown",e=>{if(e.key==="Enter")searchPage(e.target.value)});
updateProgress();render();
</script>
</body></html>
